name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      # TreatWarningsAsErrors is on (Directory.Build.props); this builds every TargetFramework,
      # so a netstandard2.0-only break fails here even though the tests only run on net10.0.
      - run: dotnet build --no-restore --configuration Release

      # Microsoft.NET.Test.Sdk ships Microsoft Code Coverage, so no extra package is needed.
      - run: dotnet test --no-build --configuration Release --collect "Code Coverage;Format=cobertura" --results-directory coverage

      - name: Coverage report
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@70c37c4d588cff5bf9cf190830c6f01dfcfb884b # 5.6.1
        with:
          reports: coverage/**/*.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub;Cobertura;HtmlInline
          assemblyfilters: -conduit.tests

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage-report
