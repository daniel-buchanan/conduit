name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      # TreatWarningsAsErrors is on (Directory.Build.props); this builds every TargetFramework,
      # so a netstandard2.0-only break fails here even though the tests only run on net10.0.
      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release
